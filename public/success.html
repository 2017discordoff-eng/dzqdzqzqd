<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification réussie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #07040f;
    color: #e3e5e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 24px;
  }

  .card {
    background: rgba(18, 10, 32, 0.72);
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 24px;
    padding: 52px 44px 44px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 0 0 1px rgba(139, 92, 246, 0.08),
      0 24px 64px rgba(0, 0, 0, 0.6),
      0 0 80px rgba(109, 40, 217, 0.12) inset;
    animation: cardIn .6s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }

  .check-wrap {
    width: 80px;
    height: 80px;
    margin: 0 auto 28px;
    position: relative;
  }

  .check-bg {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4);
    animation: checkPop .5s cubic-bezier(.16,1,.3,1) .2s both;
  }

  @keyframes checkPop {
    from { opacity: 0; transform: scale(.6) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1)  rotate(0deg);   }
  }

  .check-bg svg {
    width: 42px;
    height: 42px;
    stroke: #fff;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .check-path {
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: drawCheck .5s ease .5s forwards;
  }

  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.3px;
    margin-bottom: 10px;
    color: #f0eeff;
  }

  .subtitle {
    color: #8b8fa8;
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 36px;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(34,197,94,.08);
    border: 1px solid rgba(34,197,94,.18);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
  }

  .info-row svg {
    width: 18px;
    height: 18px;
    fill: #22c55e;
    flex-shrink: 0;
  }

  .info-row span {
    font-size: 13.5px;
    color: #86efac;
    font-weight: 500;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139,92,246,.2), transparent);
    margin: 28px 0 20px;
  }

  .close-hint {
    color: #4b4f63;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .close-hint svg { width: 13px; height: 13px; fill: #4b4f63; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="scene">
  <div class="card">

    <div class="check-wrap">
      <div class="check-bg">
        <svg viewBox="0 0 24 24">
          <polyline class="check-path" points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <h1>Vérification réussie !</h1>
    <p class="subtitle">Ton compte Discord a bien été vérifié.<br>Tu peux fermer cette page et retourner sur Discord.</p>

    <div class="info-row">
      <!-- Shield check icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 13l-3-3 1.41-1.41L10 11.17l5.59-5.59L17 7l-7 7z"/>
      </svg>
      <span>Accès au serveur accordé</span>
    </div>

    <div class="divider"></div>

    <div class="close-hint">
      <!-- X circle icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
      </svg>
      Tu peux fermer cet onglet
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x07040f, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
  camera.position.z = 4;
  scene.fog = new THREE.FogExp2(0x07040f, 0.08);

  const count = 2200;
  const positions = new Float32Array(count * 3);
  const colors    = new Float32Array(count * 3);

  const palette = [
    new THREE.Color(0x6d28d9),
    new THREE.Color(0x9333ea),
    new THREE.Color(0x5865f2),
    new THREE.Color(0x16a34a),
    new THREE.Color(0x22c55e),
    new THREE.Color(0x4c1d95),
  ];

  for (let i = 0; i < count; i++) {
    const r = 12 * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i*3]   = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.045, vertexColors: true, transparent: true,
    opacity: 0.85, sizeAttenuation: true, depthWrite: false,
  });

  const stars = new THREE.Points(geo, mat);
  scene.add(stars);

  const orbGeo = new THREE.SphereGeometry(1, 32, 32);
  [
    { color: 0x6d28d9, x: -3,   y:  2,   z: -6, s: 1.8 },
    { color: 0x16a34a, x:  3.5, y: -1.5, z: -5, s: 1.2 },
    { color: 0x5865f2, x:  0,   y: -3,   z: -7, s: 2.2 },
    { color: 0x22c55e, x: -4,   y: -1,   z: -8, s: 1.0 },
  ].forEach(def => {
    const m = new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.07 });
    const mesh = new THREE.Mesh(orbGeo, m);
    mesh.position.set(def.x, def.y, def.z);
    mesh.scale.setScalar(def.s);
    scene.add(mesh);
  });

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const mouse = { x: 0, y: 0 };
  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth  - 0.5) * 2;
    mouse.y = (e.clientY / innerHeight - 0.5) * 2;
  });

  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    stars.rotation.y = t * 0.025;
    stars.rotation.x = t * 0.010;
    camera.position.x += (mouse.x * 0.4 - camera.position.x) * 0.03;
    camera.position.y += (-mouse.y * 0.4 - camera.position.y) * 0.03;
    camera.lookAt(scene.position);
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
