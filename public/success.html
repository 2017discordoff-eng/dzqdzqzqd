<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification réussie</title>
<style>
  :root { --bg:#0e0f13; --surface:#16181f; --border:#2a2d3a; --text:#e3e5e8; --green:#3ba55d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:48px 40px; max-width:380px;
    width:90%; text-align:center;
  }
  .icon { font-size:56px; margin-bottom:20px; }
  h1 { font-size:20px; font-weight:700; margin-bottom:10px; }
  p  { color:#72767d; font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Vérification réussie !</h1>
  <p>Tu es maintenant vérifié. Tu peux fermer cette page et retourner sur Discord.</p>
</div>
</body>
</html>
