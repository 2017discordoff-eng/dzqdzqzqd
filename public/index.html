<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification Discord</title>
<style>
  :root {
    --bg:      #0e0f13;
    --surface: #16181f;
    --border:  #2a2d3a;
    --accent:  #5865f2;
    --accent2: #4752c4;
    --text:    #e3e5e8;
    --muted:   #72767d;
    --green:   #3ba55d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .logo { font-size: 56px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p  { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent2); }
  .btn svg { width: 20px; height: 20px; fill: #fff; }
  .badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 24px;
  }
  .badge {
    background: rgba(88,101,242,.15);
    color: var(--accent);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .counter {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
  }
  .counter span { color: var(--green); font-weight: 600; }
  /* état succès — caché par défaut */
  #view-success { display: none; }
  #view-success p { margin-bottom: 0; }
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
  const app = document.getElementById('app');
  const success = new URLSearchParams(location.search).get('success');

  if (success === '1') {
    // ── PAGE SUCCÈS ──────────────────────────────────────────────
    app.innerHTML = `
      <div class="logo">✅</div>
      <h1>Vérification réussie !</h1>
      <p>Tu es maintenant vérifié. Tu peux fermer cette page et retourner sur Discord.</p>
    `;
  } else {
    // ── PAGE AUTH ────────────────────────────────────────────────
    app.innerHTML = `
      <div class="logo">🛡️</div>
      <h1>Vérification requise</h1>
      <p>Pour accéder au serveur, tu dois vérifier ton compte Discord.<br>
         Clique sur le bouton ci-dessous pour continuer.</p>
      <a class="btn" href="/api/auth">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        Vérifier avec Discord
      </a>
      <div class="badges">
        <span class="badge">identify</span>
        <span class="badge">guilds.join</span>
      </div>
      <div class="counter">
        <span id="cnt">...</span> membres vérifiés
      </div>
    `;
    fetch('/api/count')
      .then(r => r.json())
      .then(d => document.getElementById('cnt').textContent = d.count)
      .catch(() => document.getElementById('cnt').textContent = '0');
  }
</script>
</body>
</html>
