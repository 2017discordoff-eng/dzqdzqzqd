<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #07040f;
    color: #e3e5e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 24px;
  }

  .card {
    background: rgba(18, 10, 32, 0.72);
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 24px;
    padding: 52px 44px 44px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 0 0 1px rgba(139, 92, 246, 0.08),
      0 24px 64px rgba(0, 0, 0, 0.6),
      0 0 80px rgba(109, 40, 217, 0.12) inset;
    animation: cardIn .6s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }

  .icon-wrap {
    width: 80px;
    height: 80px;
    margin: 0 auto 28px;
    background: linear-gradient(135deg, #5865f2 0%, #9333ea 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(88, 101, 242, 0.45);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(88,101,242,.45); }
    50%       { box-shadow: 0 8px 48px rgba(147,51,234,.7); }
  }

  .icon-wrap svg { width: 42px; height: 42px; fill: #fff; }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.3px;
    margin-bottom: 10px;
    color: #f0eeff;
  }

  .subtitle {
    color: #8b8fa8;
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 36px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 24px;
    background: linear-gradient(135deg, #5865f2 0%, #9333ea 100%);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.1px;
    transition: opacity .15s, transform .15s, box-shadow .15s;
    box-shadow: 0 4px 20px rgba(88,101,242,.4);
  }

  .btn:hover {
    opacity: .92;
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(147,51,234,.5);
  }

  .btn:active { transform: translateY(0); opacity: 1; }

  .btn svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }

  .scopes {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }

  .scope {
    background: rgba(88,101,242,.12);
    border: 1px solid rgba(88,101,242,.22);
    color: #9b8fff;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .2px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139,92,246,.2), transparent);
    margin: 28px 0 20px;
  }

  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #6b6f85;
    font-size: 13px;
  }

  .counter-row svg { width: 14px; height: 14px; fill: #6b6f85; flex-shrink: 0; }

  .counter-row strong { color: #a78bfa; font-weight: 600; }

  .shield-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    color: #4b4f63;
    font-size: 12px;
  }
  .shield-row svg { width: 12px; height: 12px; fill: #4b4f63; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="scene">
  <div class="card">

    <!-- Icon -->
    <div class="icon-wrap">
      <!-- Discord logo SVG -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
    </div>

    <h1>Vérification requise</h1>
    <p class="subtitle">Pour accéder au serveur, connecte ton compte Discord.<br>Aucune donnée sensible n'est collectée.</p>

    <a class="btn" href="/api/auth">
      <!-- Discord logo SVG smaller -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Vérifier avec Discord
    </a>

    <div class="scopes">
      <span class="scope">identify</span>
      <span class="scope">guilds.join</span>
    </div>

    <div class="divider"></div>

    <div class="counter-row">
      <!-- Users icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      <strong id="cnt">…</strong> membres vérifiés
    </div>

    <div class="shield-row">
      <!-- Shield icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
      Connexion sécurisée via OAuth2 Discord
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Counter ───────────────────────────────────────────────────────────────────
fetch('/api/count')
  .then(r => r.json())
  .then(d => { document.getElementById('cnt').textContent = (d.count || 0).toLocaleString('fr'); })
  .catch(() => { document.getElementById('cnt').textContent = '0'; });

// ── Three.js background ───────────────────────────────────────────────────────
(function () {
  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x07040f, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
  camera.position.z = 4;

  // ── Fog
  scene.fog = new THREE.FogExp2(0x07040f, 0.08);

  // ── Particles
  const count = 2200;
  const positions = new Float32Array(count * 3);
  const colors    = new Float32Array(count * 3);
  const sizes     = new Float32Array(count);

  const palette = [
    new THREE.Color(0x6d28d9), // violet
    new THREE.Color(0x9333ea), // purple
    new THREE.Color(0x5865f2), // indigo-discord
    new THREE.Color(0xc026d3), // fuchsia
    new THREE.Color(0x1e1b4b), // deep indigo dim
    new THREE.Color(0x4c1d95), // deep violet
  ];

  for (let i = 0; i < count; i++) {
    const r = 12 * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);

    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i*3]   = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;

    sizes[i] = Math.random() * 2.8 + 0.4;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 0.045,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true,
    depthWrite: false,
  });

  const stars = new THREE.Points(geo, mat);
  scene.add(stars);

  // ── Large glowing orbs
  const orbGeo = new THREE.SphereGeometry(1, 32, 32);
  const orbs = [];

  const orbDefs = [
    { color: 0x6d28d9, x: -3,  y:  2,  z: -6, s: 1.8 },
    { color: 0x9333ea, x:  3.5, y: -1.5, z: -5, s: 1.2 },
    { color: 0x5865f2, x:  0,  y: -3,  z: -7, s: 2.2 },
    { color: 0xc026d3, x: -4,  y: -1,  z: -8, s: 1.0 },
  ];

  orbDefs.forEach(def => {
    const m = new THREE.MeshBasicMaterial({
      color: def.color,
      transparent: true,
      opacity: 0.08,
    });
    const mesh = new THREE.Mesh(orbGeo, m);
    mesh.position.set(def.x, def.y, def.z);
    mesh.scale.setScalar(def.s);
    scene.add(mesh);
    orbs.push(mesh);
  });

  // ── Resize
  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Mouse parallax
  const mouse = { x: 0, y: 0 };
  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth  - 0.5) * 2;
    mouse.y = (e.clientY / innerHeight - 0.5) * 2;
  });

  // ── Animate
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    stars.rotation.y = t * 0.025;
    stars.rotation.x = t * 0.010;

    camera.position.x += (mouse.x * 0.4 - camera.position.x) * 0.03;
    camera.position.y += (-mouse.y * 0.4 - camera.position.y) * 0.03;
    camera.lookAt(scene.position);

    orbs.forEach((o, i) => {
      o.position.y += Math.sin(t * 0.3 + i * 1.4) * 0.003;
      o.position.x += Math.cos(t * 0.2 + i * 0.9) * 0.002;
    });

    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
